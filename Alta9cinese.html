<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" href="Altavilla9.png?v=2">
  <link rel="apple-touch-icon" href="Altavilla9.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Altezza della barra superiore (usata anche per far partire lo sfondo sotto di essa) */
    :root {
      --barra: 88px;
      /* ▼▼▼ CAMBIA QUI il nome/percorso della tua immagine di sfondo ▼▼▼ */
      --sfondo: url("Sfondo9.png");
      /* Colore di riserva: viene sostituito in automatico dal colore della parte bassa dell'immagine (vedi script in fondo) */
      --colore-fondo: #7a6a58;

      /* ▼ COLORI (uguali alla pagina index) ▼ */
      --oro: #BDA133;                        /* cornici e filetti */
      --oro-chiaro: #D8BE62;                 /* oro per frecce, link e dettagli: si legge bene sul verde scuro */
      /* Verde profondo con riflesso diagonale, sempre trasparente (0.75 = 25% di trasparenza) */
      --pannello: linear-gradient(135deg,
                    rgba(14, 58, 50, 0.75) 0%,
                    rgba(9, 46, 40, 0.75) 45%,
                    rgba(4, 32, 28, 0.75) 100%);
      --testo: #F6F0DC;                      /* avorio chiaro: testi leggibili sul verde scuro */
    }

    /* Questo colore riempie tutto lo schermo, anche sotto la barra del browser del telefono */
    html { background-color: var(--colore-fondo); }

    /* Immagine di sfondo: parte SOTTO la barra e in basso sfuma nel suo stesso colore */
    body::before {
      content: "";
      position: fixed;
      top: var(--barra);
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      background:
        linear-gradient(to bottom, transparent calc(100% - 180px), var(--colore-fondo) 100%),
        var(--sfondo) center / cover no-repeat;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--testo);
      min-height: 100vh;
      padding: calc(var(--barra) + 24px) 20px 40px;
    }

    /* ===== BARRA SUPERIORE ===== */
    .barra {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: var(--barra);
      padding: 0 20px;
      background: var(--pannello);
      border-bottom: 1px solid rgba(189, 161, 51, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.2);
    }

    .barra img {
      height: 90px;
      width: 90px;
      object-fit: contain;
      display: block;
    }

    .barra h1 {
      font-family: "Cinzel", "Trajan Pro", Georgia, "Times New Roman", serif;
      font-size: 2.1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      line-height: 1.1;
      white-space: nowrap;
      color: #D4B85A; /* oro di riserva */
      /* effetto oro metallico in rilievo */
      background: linear-gradient(180deg, #F1E3AE 0%, #D2B65A 45%, #9A7B2A 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55));
    }

    /* Freccia "indietro" a sinistra nella barra */
    .indietro {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--oro-chiaro);
      background: rgba(255, 255, 255, 0.12);
      transition: background 0.2s;
    }

    .indietro svg { width: 26px; height: 26px; display: block; }

    .indietro:hover,
    .indietro:focus-visible {
      background: rgba(255, 255, 255, 0.25);
      outline: 2px solid var(--oro-chiaro);
      outline-offset: 1px;
    }

    .marchio {
      display: flex;
      align-items: center;
      gap: 16px;
      color: inherit;
      text-decoration: none;
    }

    /* ===== CONTENUTO ===== */
    main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    /* Link recensioni */
    .recensione {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 18px;
      padding: 10px 24px;
      background: var(--pannello);
      border: 1px solid rgba(189, 161, 51, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
      color: var(--testo);
      text-decoration: none;
      font-size: 1.25rem;
      transition: filter 0.2s;
    }

    .recensione:hover,
    .recensione:focus-visible {
      filter: brightness(1.35);
      outline: 2px solid var(--oro-chiaro);
      outline-offset: 2px;
    }

    .recensione svg { flex: 0 0 auto; width: 30px; height: 30px; display: block; }

    /* Riquadro centrale */
    .riquadro {
      background: var(--pannello);
      border: 1px solid rgba(189, 161, 51, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 14px;
      padding: 10px 28px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }

    /* ===== ELENCO A FISARMONICA ===== */
    .voce { border-bottom: 1px solid rgba(189, 161, 51, 0.5); }
    .voce:last-child { border-bottom: none; }

    .voce-titolo {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 18px 8px;
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 1.6rem;
      text-align: left;
      color: var(--testo);
    }

    .voce-titolo:hover { background: rgba(255, 255, 255, 0.1); }
    .voce-titolo:focus-visible { outline: 2px solid var(--oro-chiaro); outline-offset: -2px; }

    /* Freccia: punta verso la scritta (destra) e ruota in senso orario fino a puntare in basso */
    .freccia {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      color: var(--oro-chiaro);
      transition: transform 0.35s ease;
    }

    .voce-titolo[aria-expanded="true"] .freccia { transform: rotate(90deg); }

    /* Pannello che si apre */
    .pannello {
      display: grid;
      grid-template-rows: 0fr;
      visibility: hidden;
      transition: grid-template-rows 0.35s ease, visibility 0s linear 0.35s;
    }

    .pannello.aperto {
      grid-template-rows: 1fr;
      visibility: visible;
      transition: grid-template-rows 0.35s ease, visibility 0s;
    }

    .pannello-interno { overflow: hidden; }

    .contenuto { padding: 4px 8px 22px 50px; }

    .contenuto p { font-size: 1.1rem; line-height: 1.65; margin-bottom: 12px; }
    .contenuto p:last-child { margin-bottom: 0; }

    .contenuto ul { margin: 0 0 12px 20px; font-size: 1.1rem; line-height: 1.65; }
    .contenuto li { margin-bottom: 6px; }

    /* Elenco con distanze (sezione Tour): una scheda per ogni luogo */
    .contenuto ul.tappe { list-style: none; margin: 8px 0 18px; padding: 0; }

    .tappe li {
      margin: 0 0 10px;
      padding: 12px 16px 14px;
      background: rgba(0, 0, 0, 0.22);
      border: 2px solid var(--oro);
      border-radius: 8px;
      font-size: 1.02rem;
      line-height: 1.55;
    }

    .tappe li:last-child { margin-bottom: 0; }

    .tappe strong {
      display: block;
      font-size: 1.2rem;
      line-height: 1.3;
      color: var(--testo);
    }

    .dist {
      display: block;
      width: fit-content;
      margin: 6px 0 8px;
      padding: 2px 12px;
      border-radius: 999px;
      background: rgba(189, 161, 51, 0.22);
      color: var(--oro-chiaro);
      font-size: 0.9rem;
      font-weight: bold;
    }

    .credenziali a { color: var(--oro-chiaro); }

    /* Nota sotto lo username del Wi-Fi */
    .credenziali .nota {
      display: block;
      margin: 0 0 6px;
      font-size: 0.85rem;
      line-height: 1.4;
      opacity: 0.85;
    }

    .credenziali {
      background: rgba(0, 0, 0, 0.22);
      border: 2px solid var(--oro);
      border-radius: 6px;
      padding: 12px 16px;
      margin: 4px 0 14px;
      font-size: 1.15rem;
      line-height: 1.8;
    }

    /* ===== SPAZI PER LE IMMAGINI ===== */
    .foto-griglia {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .foto-griglia.una { grid-template-columns: 1fr; }

    .foto {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.22);
      border: 2px solid var(--oro);
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 0.9rem;
      color: var(--oro-chiaro);
      padding: 8px;
    }

    .foto::before { content: "在此插入图片"; }

    .una .foto { aspect-ratio: 16 / 9; }

    .foto img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Immagine cliccabile */
    .foto a {
      position: absolute;
      inset: 0;
      display: block;
      cursor: pointer;
    }

    .foto a:focus-visible { outline: 3px solid var(--oro-chiaro); outline-offset: -3px; }

    /* ===== TELEFONO ===== */
    @media (max-width: 480px) {
      :root { --barra: 64px; }
      body { padding: calc(var(--barra) + 16px) 12px 28px; }
      .barra { gap: 10px; padding: 0 12px; }
      .marchio { gap: 10px; }
      .barra img { height: 54px; width: 54px; }
      .barra h1 { font-size: 0.95rem; letter-spacing: 0.04em; }
      .indietro { left: 6px; width: 34px; height: 34px; }
      .indietro svg { width: 22px; height: 22px; }
      .recensione { font-size: 1.05rem; padding: 10px 18px; gap: 10px; }
      .riquadro { padding: 6px 14px; }
      .voce-titolo { font-size: 1.35rem; padding: 16px 4px; gap: 12px; }
      .contenuto { padding: 2px 4px 20px 4px; }
      .tappe li { padding: 10px 12px 12px; }
      .tappe strong { font-size: 1.1rem; }
    }
  </style>
</head>

  <script>
    document.querySelectorAll('.voce-titolo').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var aperto = btn.getAttribute('aria-expanded') === 'true';

        // Chiude tutte le altre sezioni aperte
        document.querySelectorAll('.voce-titolo').forEach(function (altroBtn) {
          if (altroBtn !== btn) {
            altroBtn.setAttribute('aria-expanded', 'false');
            document.getElementById(altroBtn.getAttribute('aria-controls')).classList.remove('aperto');
          }
        });

        // Apre o chiude la sezione su cui abbiamo cliccato
        btn.setAttribute('aria-expanded', String(!aperto));
        document.getElementById(btn.getAttribute('aria-controls')).classList.toggle('aperto', !aperto);
      });
    });
  </script>

  <script>
    (function () {
      var m = getComputedStyle(document.documentElement).getPropertyValue('--sfondo').match(/url\(["']?(.*?)["']?\)/);
      if (!m) return;
      var img = new Image();
      img.onload = function () {
        try {
          var n = 8, c = document.createElement('canvas');
          c.width = c.height = n;
          var x = c.getContext('2d');
          x.drawImage(img, 0, img.height * 0.9, img.width, img.height * 0.1, 0, 0, n, n);
          var d = x.getImageData(0, 0, n, n).data, r = 0, g = 0, b = 0, k = n * n;
          for (var i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
          document.documentElement.style.setProperty('--colore-fondo',
            'rgb(' + Math.round(r / k) + ',' + Math.round(g / k) + ',' + Math.round(b / k) + ')');
        } catch (e) { }
      };
      img.src = m[1];
    })();
  </script>
